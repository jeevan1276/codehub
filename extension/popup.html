<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeHub</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        <span>CodeHub</span>
      </div>
      <div class="status-indicator" id="statusIndicator">
        <span class="dot"></span>
        <span class="text">Checking...</span>
      </div>
    </header>

    <main>
      <section class="section">
        <h3>Queue Status</h3>
        <div class="queue-stats" id="queueStats">
          <div class="stat">
            <span class="stat-value" id="pendingCount">0</span>
            <span class="stat-label">Pending</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="processingCount">0</span>
            <span class="stat-label">Processing</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="completedCount">0</span>
            <span class="stat-label">Completed</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="failedCount">0</span>
            <span class="stat-label">Failed</span>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="section-header">
          <h3>Recent Activity</h3>
          <button class="btn btn-small" id="retryBtn" disabled>Retry Failed</button>
        </div>
        <div class="queue-list" id="queueList">
          <div class="empty-state">Loading...</div>
        </div>
      </section>

      <section class="section">
        <div class="section-header">
          <h3>Sync Status</h3>
          <span class="rate-limit" id="rateLimit">Rate limit: --</span>
        </div>
        <div class="sync-actions">
          <button class="btn btn-primary" id="syncBtn">Sync Now</button>
          <button class="btn btn-secondary" id="optionsBtn">Settings</button>
        </div>
        <div class="last-sync" id="lastSync">Last sync: Never</div>
      </section>
    </main>

    <footer>
      <a href="#" id="githubLink" target="_blank">View on GitHub</a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
